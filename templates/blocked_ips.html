<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blocked IPs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 p-4 sm:p-6">
    <header class="bg-white p-4 sm:p-6 rounded-lg shadow-lg mb-6">
        <h2 class="text-3xl font-extrabold text-red-600 text-center">Blocked IP Addresses</h2>
    </header>

    <main class="bg-white p-6 rounded-lg shadow-lg">
        <ul class="divide-y divide-gray-200">
            {% for ip in ips %}
                <li class="py-4 flex items-center justify-between">
                    <span class="text-lg font-mono">{{ ip }}</span>
                    <a href="/unblock/{{ ip }}" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-full transition duration-150 ease-in-out shadow-md flex items-center">
                        <i class="fas fa-check-circle mr-2"></i>Unblock
                    </a>
                </li>
            {% else %}
                <li class="text-center py-8 text-gray-500">No IP addresses are currently blocked.</li>
            {% endfor %}
        </ul>
        <div class="mt-6 text-center">
            <a href="/" class="text-blue-600 hover:text-blue-800 font-medium transition duration-150 ease-in-out">
                <i class="fas fa-arrow-left mr-2"></i>Back to Dashboard
            </a>
        </div>
    </main>
</body>
</html>
